; SerialPill custom firmware for The Pill by Shelly (ESP32-C3, 8 MB)
[platformio]
src_dir = main

[env:pill]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = espidf
board = esp32-c3-devkitm-1
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200


; files embedded by main/CMakeLists.txt must be listed here as well for PlatformIO
board_build.embed_files =
  main/bootloader/bootloader-std.bin
  main/web/xterm.js.gz
  main/web/xterm.css.gz
  main/web/xterm-addon-fit.js.gz
  main/web/blades.min.css.gz
board_build.embed_txtfiles =
  main/web/index.html
  main/shelly_ca.pem

; same firmware, but logs stay on USB-C (COM bridge off by default) for bring-up
[env:pill-debug]
extends = env:pill
build_flags = -DSP_USB_BRIDGE_DEFAULT=0
